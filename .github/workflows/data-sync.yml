name: Data Sync

# Bilerek sadece "workflow_dispatch" var — otomatik bir "schedule:" tetikleyici
# YOK. Bu iş elle "Run workflow" denmeden çalışmaz. Birkaç temiz manuel
# çalıştırma gözlemlendikten sonra ayrı bir adımda schedule eklenip
# otomasyon açılacak (bkz. proje planı).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Scrape program sources
        working-directory: backend
        run: python -m scripts.scrape

      - name: Ingest scraped programs into Supabase
        working-directory: backend
        run: python -m scripts.ingest
